[project]
name = "mcp-r-format"
version = "0.1.0"
description = "MCP server for R code formatting via air and ry"
requires-python = ">=3.10"
dependencies = ["mcp"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[project.scripts]
r-format-mcp = "server:main"
