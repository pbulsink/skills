[project]
name = "mcp-r-tools"
version = "0.1.0"
description = "MCP server for R package development tools via RScript.exe"
requires-python = ">=3.10"
dependencies = ["mcp", "python-dotenv"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[project.scripts]
r-tools-mcp = "server:main"
